<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0b0611"><title>DJ JW | Soundboard</title>
<style>
:root{--bg:#08060c;--panel:#13101b;--purple:#b14aff;--pink:#ff3cc7;--text:#f8f3ff;--muted:#9c91aa}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#30134c 0%,var(--bg) 52%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
main{max-width:900px;margin:auto;padding:22px 16px 44px}header{text-align:center;padding:22px 0 26px}.logo{font-size:clamp(56px,13vw,108px);font-weight:1000;letter-spacing:-.08em;line-height:.95;color:#fff;text-shadow:0 0 12px #a63dff,0 0 38px #7c20c7}.logo span{color:var(--purple)}.sub{font-size:12px;letter-spacing:.35em;color:#c8a4ef;margin-top:12px}.slogan{font-size:clamp(14px,3vw,21px);font-weight:900;letter-spacing:.08em;margin:24px 0 5px}.slogan em{font-style:normal;color:#d38bff}.topline{color:var(--muted);font-size:12px;letter-spacing:.2em}
.deck{background:linear-gradient(180deg,#171120,#0f0b15);border:1px solid #382449;border-radius:24px;padding:18px;box-shadow:0 16px 60px #0008,0 0 30px #8a28bb22}.now{display:flex;align-items:center;gap:12px;border-radius:15px;background:#0a0810;border:1px solid #292031;padding:12px 14px;margin-bottom:16px}.dot{width:10px;height:10px;background:#7d7d88;border-radius:50%;box-shadow:0 0 0 transparent}.dot.playing{background:#c56bff;box-shadow:0 0 12px #c56bff}.nowtxt{min-width:0;flex:1}.nowtitle{font-weight:800}.nowhint{color:var(--muted);font-size:12px;margin-top:2px}.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pad{min-height:125px;border:1px solid #48305b;border-radius:17px;background:linear-gradient(145deg,#29163b,#15101f);color:#fff;cursor:pointer;padding:16px 10px;text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s;position:relative;overflow:hidden}.pad:active{transform:scale(.97)}.pad:hover{border-color:#bb6dff;box-shadow:0 0 20px #982cff30}.pad .num{font-size:11px;letter-spacing:.18em;color:#bd84f4}.pad .name{font-size:17px;font-weight:900;margin-top:9px}.pad .voice{font-size:12px;color:#a99ab9;margin-top:4px}.pad.active{border-color:#c56bff;background:linear-gradient(145deg,#472365,#20132e);box-shadow:0 0 22px #b64dff55}.pad.active:after{content:'PLAYING';position:absolute;right:12px;top:12px;font-size:9px;letter-spacing:.12em;color:#e3b8ff}.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:16px}.stop{border:1px solid #7e2448;background:#32101f;color:#ffd7e6;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer}.volume{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.12em;background:#0b0811;border:1px solid #2b2036;border-radius:12px;padding:10px 13px}input{accent-color:#bd62ff;width:120px}.footer{text-align:center;color:#756781;font-size:11px;letter-spacing:.25em;margin-top:20px}.disclaimer{color:#766c81;font-size:11px;text-align:center;margin-top:14px}
@media(min-width:650px){.pads{grid-template-columns:repeat(3,minmax(0,1fr))}.pad{min-height:145px}.deck{padding:24px}.logo{letter-spacing:-.07em}}
</style></head><body><main><header><div class="topline">OFFICIAL AUDIO DECK</div><div class="logo">DJ <span>JW</span></div><div class="sub">JEHOVAH WITNESS</div><div class="slogan">IF IT AIN'T <em>DJ JW</em>, I AIN'T LISTENING.</div></header>
<section class="deck"><div class="now"><div class="dot" id="dot"></div><div class="nowtxt"><div class="nowtitle" id="now">DECK READY</div><div class="nowhint" id="hint">Tap a pad to play your uploaded tag</div></div></div><div class="pads" id="pads"></div><div class="tools"><button class="stop" id="stop">■ STOP ALL</button><label class="volume">VOLUME <input id="vol" type="range" min="0" max="1" step=".01" value=".85"></label></div></section>
<div class="footer">DJ JW IN THE HOUSE · SOUND CHECK</div><div class="disclaimer">Your uploaded audio clips are embedded locally in this ZIP. No internet needed.</div></main>
<script>
const tags=[
{file:'tag-01.mp3',name:'TAG 01',voice:'Kai · Clean / Modern'},
{file:'tag-02.mp3',name:'TAG 02',voice:'Lauren · Soft / Friendly'},
{file:'tag-03.mp3',name:'TAG 03',voice:'Edward · Loud / Cocky'},
{file:'tag-04.mp3',name:'TAG 04',voice:'Odom · Deep / Dramatic'},
{file:'tag-05.mp3',name:'TAG 05',voice:'Kai · Clean / Modern'}];
const pads=document.getElementById('pads');const players=[];let current=null;const dot=document.getElementById('dot');const now=document.getElementById('now');const hint=document.getElementById('hint');const volume=document.getElementById('vol');
tags.forEach((t,i)=>{const b=document.createElement('button');b.className='pad';b.innerHTML=`<div class="num">AUDIO PAD ${String(i+1).padStart(2,'0')}</div><div class="name">${t.name}</div><div class="voice">${t.voice}</div>`;const a=new Audio('sounds/'+t.file);a.preload='auto';a.volume=Number(volume.value);players.push(a);b.addEventListener('click',()=>{stopAll();a.currentTime=0;a.volume=Number(volume.value);current={audio:a,button:b};b.classList.add('active');dot.classList.add('playing');now.textContent=t.name;hint.textContent='Playing '+t.voice;a.play().catch(e=>{hint.textContent='Tap again to allow audio playback'});a.onended=()=>{b.classList.remove('active');dot.classList.remove('playing');now.textContent='DECK READY';hint.textContent='Tap a pad to play your uploaded tag';current=null;};});pads.appendChild(b);});
function stopAll(){players.forEach(a=>{a.pause();a.currentTime=0;});document.querySelectorAll('.pad').forEach(b=>b.classList.remove('active'));dot.classList.remove('playing');now.textContent='DECK READY';hint.textContent='Tap a pad to play your uploaded tag';current=null;}
document.getElementById('stop').addEventListener('click',stopAll);volume.addEventListener('input',()=>players.forEach(a=>a.volume=Number(volume.value)));
</script></body></html>
